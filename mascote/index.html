<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mascote do Wez</title>
<style>
  :root {
    --bg: #e9d3b8;
    --bg-2: #dfc4a3;
    --ink: #2a1d1a;
    --card: #fffaf2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    background: radial-gradient(circle at 50% 35%, #f3e3cf 0, var(--bg) 45%, var(--bg-2) 100%);
    background-attachment: fixed;
  }
  h1, h2 { margin: 0; letter-spacing: .5px; }

  /* ---------- Hero ---------- */
  .hero {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    text-align: center;
  }
  .hero .mascote { width: min(340px, 82vw); display: block; margin: 0 auto; }
  .hero h1 {
    margin-top: 8px;
    background: var(--card);
    display: inline-block;
    padding: 8px 26px;
    border-radius: 999px;
    border: 4px solid var(--ink);
    box-shadow: 0 6px 0 var(--ink);
    font-size: 2rem;
  }
  .botoes { margin-top: 18px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .botoes button {
    font: inherit; font-weight: bold;
    padding: 8px 16px; border-radius: 999px;
    border: 3px solid var(--ink); background: #fff; color: var(--ink);
    box-shadow: 0 4px 0 var(--ink); cursor: pointer;
  }
  .botoes button[aria-pressed="true"] { background: #f6b26b; }
  .botoes button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .dica { margin-top: 14px; font-weight: bold; opacity: .75; }

  /* ---------- Expressões ---------- */
  .mascote .boca-serio { display: none; }
  .mascote.serio .boca-sorriso { display: none; }
  .mascote.serio .boca-serio { display: inline; }
  .mascote.serio .blush { opacity: .25; }

  /* ---------- Animação parada ---------- */
  .palpebra { transform-box: fill-box; transform-origin: top; }
  .idle .corpo-todo { animation: respira 2.6s ease-in-out infinite; transform-origin: 200px 516px; }
  .idle .palpebra { animation: pisca 4.2s infinite; }
  .idle .braco-tchau { animation: tchau 1.1s ease-in-out infinite; transform-box: view-box; transform-origin: 278px 346px; }
  .idle .sobrancelha-d { animation: ergue 5s ease-in-out infinite; }
  @keyframes respira { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.015,.985); } }
  @keyframes pisca { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(2.4); } }
  @keyframes tchau { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(10deg); } }
  @keyframes ergue { 0%, 72%, 100% { transform: translateY(0); } 78%, 90% { transform: translateY(-6px); } }

  /* ---------- Trilha de scroll ---------- */
  .trilha { height: 420vh; position: relative; }
  .palco {
    position: sticky; top: 0;
    height: 100vh;
    overflow: hidden;
  }
  .palco h2 {
    position: absolute; top: 28px; left: 16px; right: 16px;
    text-align: center; font-size: 1.6rem;
  }
  .chao {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 20vh;
    background: #c9a77f;
    border-top: 5px solid var(--ink);
  }
  .andador {
    position: absolute;
    bottom: calc(20vh - 14px);
    left: 0;
    width: min(200px, 42vw);
    will-change: transform;
  }
  .andador .mascote { display: block; width: 100%; }
  .andador.virado .mascote { transform: scaleX(-1); }

  .fim { min-height: 60vh; display: grid; place-items: center; font-size: 1.5rem; font-weight: bold; text-align: center; padding: 16px; }

  @media (prefers-reduced-motion: reduce) {
    .idle .corpo-todo, .idle .palpebra, .idle .braco-tchau, .idle .sobrancelha-d { animation: none; }
  }
</style>
</head>

<script>
  const tpl = document.getElementById('mascote-svg');
  const clone = () => tpl.content.firstElementChild.cloneNode(true);

  // Hero: parado, respirando, piscando e dando tchau
  const hero = clone();
  hero.classList.add('idle');
  document.getElementById('hero-slot').appendChild(hero);

  // Andador: caminha conforme o scroll
  const andador = document.getElementById('andador');
  const walker = clone();
  andador.appendChild(walker);
  const mascotes = [hero, walker];

  // Troca de expressão
  document.querySelectorAll('[data-expr]').forEach(btn => {
    btn.addEventListener('click', () => {
      const serio = btn.dataset.expr === 'serio';
      mascotes.forEach(m => m.classList.toggle('serio', serio));
      document.querySelectorAll('[data-expr]').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
    });
  });

  const pernaE = walker.querySelector('.perna-e');
  const pernaD = walker.querySelector('.perna-d');
  const bracoE = walker.querySelector('.braco-e');
  const bracoT = walker.querySelector('.braco-tchau');
  const corpo = walker.querySelector('.corpo-todo');
  const trilha = document.getElementById('trilha');

  let ultimoY = window.scrollY;
  function atualizar() {
    const inicio = trilha.offsetTop;
    const total = trilha.offsetHeight - window.innerHeight;
    const p = Math.min(1, Math.max(0, (window.scrollY - inicio) / total));

    // anda na horizontal acompanhando o progresso do scroll
    const maxX = window.innerWidth - andador.offsetWidth;
    andador.style.transform = `translateX(${p * maxX}px)`;

    // ciclo de passos: pernas e braços balançam com a distância rolada
    const passo = Math.sin(window.scrollY / 24);
    pernaE.setAttribute('transform', `rotate(${passo * 22} 180 424)`);
    pernaD.setAttribute('transform', `rotate(${-passo * 22} 220 424)`);
    bracoE.setAttribute('transform', `rotate(${-passo * 18} 122 346)`);
    bracoT.setAttribute('transform', `rotate(${passo * 10} 278 346)`);
    corpo.setAttribute('transform', `translate(0 ${-Math.abs(passo) * 7})`);

    // rolou para cima? ele vira e volta
    if (window.scrollY < ultimoY) andador.classList.add('virado');
    else if (window.scrollY > ultimoY) andador.classList.remove('virado');
    ultimoY = window.scrollY;
  }
  window.addEventListener('scroll', () => requestAnimationFrame(atualizar), { passive: true });
  window.addEventListener('resize', atualizar);
  atualizar();
